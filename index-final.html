<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сайт</title>
    <link rel="stylesheet" href="style-final.css">
</head>
<body>

<header class="header">
    <div class="logo">Магазин</div>

    <nav>
        <a href="home">Главная</a>
        <a href="catalog">Каталог</a>
        <a href="contact">Контакты</a>
    </nav>

    <a href="#contact" class="header-btn">Связаться</a>
</header>

<section class="hero" id="home">
    <h1>Велком</h1>
    <p>Выбирайте лучшие товары не по доступным ценам</p>
    <a href="#catalog" class="hero-btn">Смотреть каталог</a>
</section>

<section class="catalog" id="catalog">
    <h2>Каталог</h2>

    <div class="catalog-grid">

        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS7ujmq1nQzLQJvf76i2naX-LBogqy0-BXYdGmROK8Ekg&s" alt="Наушники">
            <h3>Наушники</h3>
            <p>500 евро</p>
            <button>Купить</button>
        </div>

        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTPg2qJXNi_9PUe4_NMil7Q05McF5wc4FdOYfXdmW8l0g&s=10" alt="Часы">
            <h3>Часы</h3>
            <p>75 евро</p>
            <button>Купить</button>
        </div>

        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSbtLz7ZCS9wU1DVS_O2veZ0MhX0dtj4HePWO8T4f5BIw&s" alt="Телефон">
            <h3>Смартфон</h3>
            <p>300 евро</p>
            <button>Купить</button>
        </div>

        <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRL5XP_NVmsgW1-tjWWqasnWY5ep-3pa4V_F18BUMdRDSKOXdfhrkRNKvS7&s=10" alt="Кроссовки">
            <h3>Кроссовки</h3>
            <p>60 евро</p>
            <button>Купить</button>
        </div>

    </div>
</section>

<section class="contact" id="contact">
    <h2>Обратная связь</h2>

    <form>
        <input type="text" placeholder="Ваше имя">
        <input type="email" placeholder="Ваш email">
        <textarea placeholder="Ваше сообщение"></textarea>
        <button type="submit">Отправить</button>
    </form>
</section>

<footer>
    <p>© 2026 SHOP</p>
</footer>

</body>
</html>
